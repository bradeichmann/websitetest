<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHSAT Study App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        /* Setup Screen */
        .setup-screen {
            display: none;
        }

        .setup-screen.active {
            display: block;
        }

        .setup-section {
            margin-bottom: 30px;
        }

        .setup-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .option-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .toggle-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .topic-filter {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .topic-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .topic-item:last-child {
            border-bottom: none;
        }

        .topic-performance {
            color: #667eea;
            font-weight: 600;
        }

        .performance-bar {
            width: 60px;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .performance-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 30px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        /* Test Screen */
        .test-screen {
            display: none;
        }

        .test-screen.active {
            display: block;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .test-progress {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .test-timer {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .test-timer.warning {
            color: #ff6b6b;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            line-height: 1.5;
        }

        .passage-text {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            max-height: 300px;
            overflow-y: auto;
        }

        .answer-options {
            display: grid;
            gap: 10px;
        }

        .answer-option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
        }

        .answer-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .answer-option.selected {
            background: #e3e8ff;
            border-color: #667eea;
        }

        .answer-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .answer-option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: space-between;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .nav-btn.primary:hover {
            border-color: transparent;
        }

        /* Results Screen */
        .results-screen {
            display: none;
        }

        .results-screen.active {
            display: block;
        }

        .results-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .score-display {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .score-label {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
        }

        .score-card-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .score-card-value {
            font-size: 24px;
            font-weight: 700;
        }

        .results-detail {
            margin-top: 30px;
        }

        .results-detail h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .question-review {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .review-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .review-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .review-status.correct {
            background: #d4edda;
            color: #155724;
        }

        .review-status.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .review-answer {
            font-size: 13px;
            margin: 8px 0;
            color: #555;
        }

        .review-explanation {
            background: white;
            padding: 12px;
            border-left: 4px solid #667eea;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .end-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .end-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .home-btn {
            background: #f0f0f0;
            color: #333;
        }

        .home-btn:hover {
            background: #e0e0e0;
        }

        .history-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .history-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .history-score {
            font-weight: 600;
            color: #667eea;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .test-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .option-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 SHSAT Study App</h1>
            <p>Practice tests to track your progress</p>
        </div>

        <div class="content">
            <!-- Setup Screen -->
            <div class="setup-screen active" id="setupScreen">
                <h2 style="margin-bottom: 30px; color: #333;">Configure Your Practice Test</h2>

                <div class="setup-section">
                    <h2>Test Duration</h2>
                    <div class="option-group" id="durationOptions">
                        <button class="toggle-btn" data-duration="10">10 min</button>
                        <button class="toggle-btn" data-duration="20">20 min</button>
                        <button class="toggle-btn" data-duration="30">30 min</button>
                        <button class="toggle-btn" data-duration="40">40 min</button>
                        <button class="toggle-btn" data-duration="50">50 min</button>
                        <button class="toggle-btn" data-duration="60">60 min</button>
                        <button class="toggle-btn" data-duration="180">Full Test (180 min)</button>
                    </div>
                </div>

                <div class="setup-section">
                    <h2>Test Mode</h2>
                    <div class="option-group" id="timedOptions">
                        <button class="toggle-btn active" data-timed="true">Timed</button>
                        <button class="toggle-btn" data-timed="false">Untimed</button>
                    </div>
                </div>

                <div class="setup-section">
                    <h2>Test Sections</h2>
                    <div class="option-group" id="sectionOptions">
                        <button class="toggle-btn active" data-section="both">Both</button>
                        <button class="toggle-btn" data-section="ELA">ELA Only</button>
                        <button class="toggle-btn" data-section="Math">Math Only</button>
                    </div>
                </div>

                <div class="setup-section">
                    <h2>Focus by Topic</h2>
                    <div class="topic-filter" id="topicFilter"></div>
                </div>

                <button class="start-btn" onclick="app.startTest()">Start Practice Test</button>

                <div class="history-section">
                    <h3>Recent Practice Tests</h3>
                    <div id="historyList"></div>
                </div>
            </div>

            <!-- Test Screen -->
            <div class="test-screen" id="testScreen">
                <div class="test-header">
                    <div class="test-progress">
                        Question <span id="currentQuestion">1</span> of <span id="totalQuestions">0</span>
                    </div>
                    <div class="test-timer" id="timerDisplay">0:00</div>
                </div>

                <div class="question-container">
                    <div id="passageContainer" class="passage-text" style="display: none;"></div>
                    <div class="question-text" id="questionText"></div>
                    <div class="answer-options" id="answerOptions"></div>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn" id="prevBtn" onclick="app.previousQuestion()" disabled>← Previous</button>
                    <button class="nav-btn primary" id="nextBtn" onclick="app.nextQuestion()">Next →</button>
                </div>
            </div>

            <!-- Results Screen -->
            <div class="results-screen" id="resultsScreen">
                <div class="results-summary">
                    <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px;">Your Score</div>
                    <div class="score-display" id="finalScore">0/0</div>
                    <div class="score-label" id="estimatedScore">Estimated Full Test Score: —</div>
                    <div class="score-breakdown">
                        <div class="score-card">
                            <div class="score-card-label">ELA</div>
                            <div class="score-card-value" id="elaScore">—</div>
                        </div>
                        <div class="score-card">
                            <div class="score-card-label">Math</div>
                            <div class="score-card-value" id="mathScore">—</div>
                        </div>
                        <div class="score-card">
                            <div class="score-card-label">Accuracy</div>
                            <div class="score-card-value" id="accuracy">—</div>
                        </div>
                    </div>
                </div>

                <div class="results-detail">
                    <h3>Review Your Answers</h3>
                    <div id="reviewList"></div>
                </div>

                <div class="end-buttons">
                    <button class="retry-btn" onclick="app.backToSetup()">Take Another Test</button>
                </div>
            </div>
        </div>
    </div>

        class SHSATApp {
            constructor() {
                this.questions = questionsData;
                this.testQuestions = [];
                this.currentIndex = 0;
                this.answers = {};
                this.startTime = null;
                this.timeLimit = null;
                this.isTimed = true;
                this.timerInterval = null;
                this.testStartTime = null;
                this.history = JSON.parse(localStorage.getItem('shsatHistory') || '[]');
                this.selectedTopics = new Set();
                this.selectedSection = 'both';
                
                this.initializeUI();
            }

            initializeUI() {
                this.renderTopicFilter();
                this.renderHistory();
                this.setupEventListeners();
            }

            setupEventListeners() {
                document.querySelectorAll('[data-duration]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-duration]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.timeLimit = parseInt(e.target.dataset.duration);
                    });
                });

                document.querySelectorAll('[data-timed]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-timed]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.isTimed = e.target.dataset.timed === 'true';
                    });
                });

                document.querySelectorAll('[data-section]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-section]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.selectedSection = e.target.dataset.section;
                    });
                });
            }

            renderTopicFilter() {
                const topics = {};
                this.questions.forEach(q => {
                    if (!topics[q.topic]) {
                        topics[q.topic] = { count: 0, correct: 0 };
                    }
                    topics[q.topic].count++;
                    if (q.everettCorrect) topics[q.topic].correct++;
                });

                const filterHtml = Object.entries(topics)
                    .sort((a, b) => a[0].localeCompare(b[0]))
                    .map(([topic, stats]) => {
                        const percentage = Math.round((stats.correct / stats.count) * 100);
                        return `
                            <div class="topic-item">
                                <label style="display: flex; align-items: center; cursor: pointer; flex: 1;">
                                    <input type="checkbox" data-topic="${topic}" style="margin-right: 10px; cursor: pointer;">
                                    <span>${topic}</span>
                                </label>
                                <span class="topic-performance">${stats.correct}/${stats.count} (${percentage}%)</span>
                            </div>
                        `;
                    })
                    .join('');

                document.getElementById('topicFilter').innerHTML = filterHtml;

                document.querySelectorAll('[data-topic]').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            this.selectedTopics.add(e.target.dataset.topic);
                        } else {
                            this.selectedTopics.delete(e.target.dataset.topic);
                        }
                    });
                });
            }

            renderHistory() {
                const historyHtml = this.history.slice(-5).reverse().map((test, idx) => {
                    const date = new Date(test.timestamp).toLocaleDateString();
                    const accuracy = Math.round((test.correct / test.total) * 100);
                    return `
                        <div class="history-item">
                            <div>
                                <div style="font-weight: 600;">${test.section === 'both' ? 'Full' : test.section.toUpperCase()} Test (${test.total} q)</div>
                                <div style="font-size: 12px; color: #999;">${date}</div>
                            </div>
                            <div class="history-score">${test.correct}/${test.total} (${accuracy}%)</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('historyList').innerHTML = historyHtml || '<p style="color: #999; text-align: center;">No tests taken yet</p>';
            }

            startTest() {
                // Filter questions
                this.testQuestions = this.questions.filter(q => {
                    let sectionMatch = this.selectedSection === 'both' || q.section === this.selectedSection;
                    let topicMatch = this.selectedTopics.size === 0 || this.selectedTopics.has(q.topic);
                    return sectionMatch && topicMatch;
                });

                if (this.testQuestions.length === 0) {
                    alert('No questions match your filters. Please adjust your selections.');
                    return;
                }

                // Calculate how many questions to show based on time limit
                const questionsToShow = this.calculateQuestionsForTime();
                this.testQuestions = this.testQuestions.slice(0, questionsToShow);

                this.currentIndex = 0;
                this.answers = {};
                this.testStartTime = Date.now();
                this.startTime = this.isTimed ? Date.now() : null;

                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('testScreen').classList.add('active');
                document.getElementById('resultsScreen').classList.remove('active');

                this.renderQuestion();

                if (this.isTimed) {
                    this.startTimer();
                }
            }

            calculateQuestionsForTime() {
                // Assuming ~1 minute per question on average
                return Math.min(this.timeLimit, this.testQuestions.length);
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                    const remaining = Math.max(0, (this.timeLimit * 60) - elapsed);
                    
                    const minutes = Math.floor(remaining / 60);
                    const seconds = remaining % 60;
                    
                    const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    document.getElementById('timerDisplay').textContent = display;
                    
                    const timer = document.getElementById('timerDisplay');
                    if (remaining < 300) {
                        timer.classList.add('warning');
                    }

                    if (remaining === 0) {
                        clearInterval(this.timerInterval);
                        this.endTest();
                    }
                }, 100);
            }

            renderQuestion() {
                const q = this.testQuestions[this.currentIndex];
                
                document.getElementById('currentQuestion').textContent = this.currentIndex + 1;
                document.getElementById('totalQuestions').textContent = this.testQuestions.length;

                // Passage
                const passageContainer = document.getElementById('passageContainer');
                if (q.passage) {
                    passageContainer.textContent = q.passage;
                    passageContainer.style.display = 'block';
                } else {
                    passageContainer.style.display = 'none';
                }

                // Question
                document.getElementById('questionText').textContent = q.question;

                // Answers
                const answersHtml = q.answers.map((answer, idx) => {
                    const letter = String.fromCharCode(65 + idx); // A, B, C, D
                    const isSelected = this.answers[this.currentIndex] === letter;
                    return `
                        <div class="answer-option ${isSelected ? 'selected' : ''}" onclick="app.selectAnswer('${letter}')">
                            <strong>${letter}.</strong> ${answer}
                        </div>
                    `;
                }).join('');

                document.getElementById('answerOptions').innerHTML = answersHtml;

                // Navigation
                document.getElementById('prevBtn').disabled = this.currentIndex === 0;
                document.getElementById('nextBtn').textContent = this.currentIndex === this.testQuestions.length - 1 ? 'Finish' : 'Next →';
            }

            selectAnswer(letter) {
                this.answers[this.currentIndex] = letter;
                this.renderQuestion();
            }

            previousQuestion() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderQuestion();
                }
            }

            nextQuestion() {
                if (this.currentIndex < this.testQuestions.length - 1) {
                    this.currentIndex++;
                    this.renderQuestion();
                } else {
                    this.endTest();
                }
            }

            endTest() {
                if (this.timerInterval) clearInterval(this.timerInterval);

                // Calculate results
                let correct = 0;
                let elaCorrect = 0, elaTot = 0;
                let mathCorrect = 0, mathTot = 0;

                this.testQuestions.forEach((q, idx) => {
                    const userAnswer = this.answers[idx];
                    const isCorrect = userAnswer && userAnswer.toLowerCase() === q.correctAnswer.toLowerCase();
                    
                    if (isCorrect) correct++;
                    
                    if (q.section === 'ELA') {
                        elaTot++;
                        if (isCorrect) elaCorrect++;
                    } else {
                        mathTot++;
                        if (isCorrect) mathCorrect++;
                    }
                });

                // Save to history
                const testResult = {
                    timestamp: new Date().toISOString(),
                    correct: correct,
                    total: this.testQuestions.length,
                    section: this.selectedSection,
                    elaCorrect: elaCorrect,
                    elaTot: elaTot,
                    mathCorrect: mathCorrect,
                    mathTot: mathTot
                };
                this.history.push(testResult);
                localStorage.setItem('shsatHistory', JSON.stringify(this.history));

                // Estimate full test score
                const accuracy = correct / this.testQuestions.length;
                const estimatedFullScore = Math.round(accuracy * 100);

                // Show results
                document.getElementById('setupScreen').classList.remove('active');
                document.getElementById('testScreen').classList.remove('active');
                document.getElementById('resultsScreen').classList.add('active');

                document.getElementById('finalScore').textContent = `${correct}/${this.testQuestions.length}`;
                document.getElementById('accuracy').textContent = `${Math.round(accuracy * 100)}%`;
                document.getElementById('estimatedScore').textContent = `Estimated accuracy: ${Math.round(accuracy * 100)}%`;
                
                if (elaTot > 0) {
                    document.getElementById('elaScore').textContent = `${elaCorrect}/${elaTot}`;
                } else {
                    document.getElementById('elaScore').textContent = '—';
                }
                
                if (mathTot > 0) {
                    document.getElementById('mathScore').textContent = `${mathCorrect}/${mathTot}`;
                } else {
                    document.getElementById('mathScore').textContent = '—';
                }

                // Show review
                const reviewHtml = this.testQuestions.map((q, idx) => {
                    const userAnswer = this.answers[idx];
                    const isCorrect = userAnswer && userAnswer.toLowerCase() === q.correctAnswer.toLowerCase();
                    const answersMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
                    const correctAnswerText = q.answers[answersMap[q.correctAnswer.toUpperCase()]];
                    const userAnswerText = userAnswer ? q.answers[answersMap[userAnswer.toUpperCase()]] : 'Not answered';

                    return `
                        <div class="question-review">
                            <div class="review-status ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</div>
                            <div class="review-question">${q.question}</div>
                            <div class="review-answer"><strong>Your answer:</strong> ${userAnswer ? userAnswer + '. ' + userAnswerText : 'Not answered'}</div>
                            ${!isCorrect ? `<div class="review-answer"><strong>Correct answer:</strong> ${q.correctAnswer.toUpperCase()}. ${correctAnswerText}</div>` : ''}
                            <div class="review-explanation"><strong>Explanation:</strong> ${q.explanation}</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('reviewList').innerHTML = reviewHtml;
            }

            backToSetup() {
                this.renderHistory();
                document.getElementById('setupScreen').classList.add('active');
                document.getElementById('testScreen').classList.remove('active');
                document.getElementById('resultsScreen').classList.remove('active');
            }
        }

        // Initialize the app
        const app = new SHSATApp();
    </script>
